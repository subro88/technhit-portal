server
{
    listen 80;
    listen [::]:80;
    server_name technhit.in www.technhit.in;

    # Directory verification related settings for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/technhit.in.conf;

    location / {
        return 301 https://technhit.in$request_uri;
    }
}

server
{
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name technhit.in www.technhit.in;
    index index.html index.htm;
    root /www/wwwroot/technhit.in;

    # Canonical www to non-www redirect over HTTPS
    if ($host = 'www.technhit.in') {
        return 301 https://technhit.in$request_uri;
    }

    include /www/server/panel/vhost/nginx/extension/technhit.in/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/technhit.in.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration
    ssl_certificate        /www/server/panel/vhost/cert/technhit.in/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/technhit.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497 https://$host$request_uri;
    #SSL-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Prohibit putting sensitive files in certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 1. Next.js Static Chunks (Pass to container with 1-Year Immutable Caching)
    # MUST be placed before generic regex to prevent 404 on JS/CSS chunks
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 2. Public Uploads & Media (Pass to container with 30-Day Caching)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 3. Main Reverse Proxy to TechNHIT Next.js Container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (Required for Next.js HMR & Studio Live Preview)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Client Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 25M;
    access_log  /www/wwwlogs/technhit.in.log;
    error_log   /www/wwwlogs/technhit.in.error.log;
}
