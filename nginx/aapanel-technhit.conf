# =============================================================================
# aaPanel Nginx Reverse Proxy Configuration for TechNHIT (technhit.in)
# Compatible with aaPanel "Website" -> "Reverse Proxy" & "Config" tabs
# =============================================================================

# 1. Main Reverse Proxy Target
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # WebSocket Upgrade Headers (Required for Next.js HMR & Studio Live Preview)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Standard Client & Scheme Forwarding
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Proxy Buffer & Timeout
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
}

# 2. Next.js Static Chunks (Aggressive 1-Year Immutable Caching)
location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# 3. Media Uploads (30-Day Cache)
location /uploads/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

# 4. Brand & Diagrams (7-Day Cache)
location /images/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    access_log off;
}

# 5. Admin Studio & Auth Guarded Pass (No Caching)
location ~* ^/(admin|api/admin|api/auth) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    proxy_read_timeout 180s;
}
