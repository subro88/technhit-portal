# =============================================================================
# Nginx Production Configuration for TechNHIT (technhit.in)
# NHIT Suite Industrial Systems & AI Cluster Publication
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=technhit_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=technhit_admin:10m rate=5r/s;

# Upstream Next.js Standalone Container
upstream technhit_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name technhit.in www.technhit.in;

    # ACME Challenge for Certbot / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://technhit.in$request_uri;
    }
}

# 2. Main HTTPS Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name technhit.in;

    # SSL Certificates (Certbot default paths)
    ssl_certificate /etc/letsencrypt/live/technhit.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technhit.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/technhit.in/chain.pem;

    # SSL Security Protocols & Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;

    # Payload & Buffer Limits
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Next.js Static Chunks (Immutable 1-Year Cache)
    location /_next/static/ {
        proxy_pass http://technhit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Media Uploads (30-Day Cache)
    location /uploads/ {
        proxy_pass http://technhit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Public Brand & Diagrams (7-Day Cache)
    location /images/ {
        proxy_pass http://technhit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # Admin Studio & Auth Guarded Rate Limiting
    location ~* ^/(admin|api/admin|api/auth) {
        limit_req zone=technhit_admin burst=10 nodelay;

        proxy_pass http://technhit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Root Reverse Proxy to Next.js
    location / {
        limit_req zone=technhit_general burst=50 nodelay;

        proxy_pass http://technhit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# 3. Canonical www -> non-www Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.technhit.in;

    ssl_certificate /etc/letsencrypt/live/technhit.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technhit.in/privkey.pem;

    return 301 https://technhit.in$request_uri;
}
